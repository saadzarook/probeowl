# Author: @SaadZarook
# Weekly update PRs for the backend's Python packages, the web app's npm packages and the
# workflows' actions. Each targets develop, as every PR does, and goes through the same checks.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Patch and minor releases together, so one PR a week rather than one per package.
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
