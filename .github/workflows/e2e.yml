# Author: @SaadZarook
# The web app against `owl serve` and the dev database stack. Runs only here, never on laptops.
name: e2e

on:
  # No paths filter: a required check that did not run leaves the pull request unmergeable.
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The local stack's test password for probeowl_ro (see dev/README.md); not a real secret.
      PROBEOWL_WALLET_DB_UAT: ProbeOwl_Ro_Local1
      PROBEOWL_LEDGER_DB_UAT: ProbeOwl_Ro_Local1
      PROBEOWL_ACCESS_DB_UAT: ProbeOwl_Ro_Local1
      PROBEOWL_RO_PASSWORD: ProbeOwl_Ro_Local1
      # CI has no system keychain; the examples' keyring: references read this file one,
      # which owl refuses unless it is allowed here, in CI only.
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
      PROBEOWL_ALLOW_INSECURE_KEYRING: "1"
      # The preview server's origins, which owl serve accepts on writes.
      PROBEOWL_WEB_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose -f dev/docker-compose.yml up --wait --wait-timeout 900
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked
      - name: Production passwords in the keychain
        working-directory: backend
        run: |
          for connector in wallet_db ledger_db access_db; do
            printf '%s\n' "$PROBEOWL_RO_PASSWORD" | uv run keyring set probeowl "$connector.prod"
          done
      - name: Create the store
        working-directory: backend
        run: uv run owl store init
      - name: Start owl serve
        working-directory: backend
        run: |
          # A copy: the probe editor's live test saves into the folder served.
          cp -r ../examples "$RUNNER_TEMP/config"
          nohup uv run owl serve --config "$RUNNER_TEMP/config" > "$RUNNER_TEMP/owl-serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:7878/openapi.json > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/owl-serve.log"
          exit 1
      - name: Build and preview the web app (no mocks)
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Validate and Inspect screens against owl serve
        working-directory: web
        run: npm run test:e2e:live
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Show logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/owl-serve.log" || true
          docker compose -f dev/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v
