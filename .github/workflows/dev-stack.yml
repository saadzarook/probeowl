# Author: @SaadZarook
# The database stack runs only here, never on developer laptops.
name: dev-stack

on:
  pull_request:
    paths: ["dev/**", "backend/**", "examples/**", ".github/workflows/dev-stack.yml"]

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose -f dev/docker-compose.yml up --wait --wait-timeout 900
      - name: Check databases and fake APIs
        run: dev/ci/check-stack.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v
