# Author: @SaadZarook
name: web

on:
  # No paths filter: a required check that did not run leaves the pull request unmergeable.
  pull_request:
  push:
    branches: [main, develop]
    paths: ["web/**", "examples/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Client is up to date with the contract
        run: npm run check:api
      - name: Mocks match examples/
        run: npm run check:mocks
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Smoke and axe tests
        run: npm run test:e2e
      # Every screen under owl serve's own Content-Security-Policy, light and dark (#148): served by
      # owl serve's mounts (dev/ci/serve_web_app.py), which need the backend and a built guide.
      - uses: astral-sh/setup-uv@v7
      - name: Backend for the strict-CSP tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run python guide_build.py
      - name: Strict CSP, contrast and dark tests
        run: npm run test:e2e:csp
