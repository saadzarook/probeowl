        truncated:
          anyOf:
          - type: string
          - type: 'null'
          title: Truncated
          description: 'Set when tables were left out: imported 1000 of 1,240 tables.'
      additionalProperties: false
      type: object
      required:
      - application
      - connector
      - environment
      - imported_at
      - tables
      title: SchemaSnapshot
      description: The schema of one connector's database in one environment, as imported.
    SecretState:
      type: string
      enum:
      - saved
      - missing
      - from_environment
      - not_needed
      title: SecretState
      description: Whether this machine has what a binding signs in with. Never the
        value.
    SetKillSwitch:
      properties:
        scope:
          $ref: '#/components/schemas/KillScope'
        application:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          - type: 'null'
          title: Application
          description: For application and connector.
        connector:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          - type: 'null'
          title: Connector
          description: For connector.
        reason:
          type: string
          minLength: 1
          title: Reason
          description: Why. Recorded in the audit.
        reference:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Reference
          description: Jira key, support case or change ID.
      additionalProperties: false
      type: object
      required:
      - scope
      - reason
      title: SetKillSwitch
      description: 'Turn one kill switch on or off, and say why: both are audited
        with the actor.'
    SetupState:
      properties:
        applications:
          type: integer
          title: Applications
          description: Applications loaded; none opens the first-run setup.
        config_folder:
          type: string
          title: Config Folder
          description: Where new applications are written.
        store:
          $ref: '#/components/schemas/StoreInfo'
        keychain:
          $ref: '#/components/schemas/KeychainInfo'
      additionalProperties: false
      type: object
      required:
      - applications
      - config_folder
      - store
      - keychain
      title: SetupState
      description: What first run needs to know before it asks anything.
    SqlBindingDraft:
      properties:
        host:
          type: string
          maxLength: 255
          minLength: 1
          title: Host
        port:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: Port
        database:
          type: string
          maxLength: 128
          minLength: 1
          title: Database
          description: Database (SQL Server, MariaDB) or service name.
        schema:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Schema
          description: Oracle only.
        user:
          type: string
          maxLength: 128
          minLength: 1
          title: User
          description: The read-only login.
        replica:
          type: boolean
          title: Replica
          default: false
        encrypt:
          type: boolean
          title: Encrypt
          description: MariaDB and Oracle; always on for SQL Server.
          default: true
        encrypt_reason:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Encrypt Reason
        trust_server_certificate:
          type: boolean
          title: Trust Server Certificate
          default: false
        trust_server_certificate_reason:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Trust Server Certificate Reason
      additionalProperties: false
      type: object
      required:
      - host
      - port
      - database
      - user
      title: SqlBindingDraft
      description: 'Where a SQL connector points in one environment, as the Add connection
        form asks it.


        Never a secret or its reference: the server names the keychain entry itself.'
    StartHealthyComparison:
      properties:
        narrow:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          - type: 'null'
          title: Narrow
          description: A closer match from the entity's list.
        subject:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Subject
          description: A known-good ID a person pasted.
      additionalProperties: false
      type: object
      title: StartHealthyComparison
      description: 'How to find the known-good subject. Neither field: the newest
        that passes.'
    StartRun:
      properties:
        application:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Application
        environment:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Environment
        probe:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Probe
        value:
          type: string
          minLength: 1
          title: Value
          description: The ID entered, such as tp_91f2c7.
        identifier:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          - type: 'null'
          title: Identifier
          description: 'Which identifier the value is. Omitted: detected from patterns.'
        investigation:
          $ref: '#/components/schemas/InvestigationRecord'
          description: Reason always; reference too when the environment is Production.
      additionalProperties: false
      type: object
      required:
      - application
      - environment
      - probe
      - value
      - investigation
      title: StartRun
      description: Start an inspect or validate run. The probe decides which.
    StepInRun:
      properties:
        id:
          type: string
          title: Id
        filled:
          anyOf:
          - type: string
          - type: 'null'
          title: Filled
          description: Its SQL or query with this run's values. Null if it has none.
        unfilled:
          items:
            $ref: '#/components/schemas/UnfilledParameter'
          type: array
          title: Unfilled
        done:
          type: boolean
          title: Done
          description: A manual step's tick, saved with the run.
          default: false
        result:
          anyOf:
          - $ref: '#/components/schemas/StepResult'
          - type: 'null'
          description: The latest run of a read query.
      additionalProperties: false
      type: object
      required:
      - id
      title: StepInRun
      description: One step of a runbook, as it stands in one run.
    StepRan:
      properties:
        id:
          type: string
          title: Id
        result:
          anyOf:
          - $ref: '#/components/schemas/StepResult'
          - type: 'null'
        run:
          anyOf:
          - type: string
          - type: 'null'
          title: Run
          description: The run a probe step started.
      additionalProperties: false
      type: object
      required:
      - id
      title: StepRan
      description: 'A step that ran: a read query''s result, or the run a probe step
        started.'
    StepResult:
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why, when the lookup failed.
        evidence:
          anyOf:
          - $ref: '#/components/schemas/Evidence'
          - type: 'null'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        actor:
          type: string
          title: Actor
        at:
          type: string
          format: date-time
          title: At
      additionalProperties: false
      type: object
      required:
      - outcome
      - actor
      - at
      title: StepResult
      description: What running a read query found. Values are masked, and it is linked
        to its run.
    StoreInfo:
      properties:
        dialect:
          type: string
          enum:
          - sqlite
          - postgresql
          - mssql
          - oracle
          - mariadb
          title: Dialect
        created_now:
          type: boolean
          title: Created Now
          description: owl serve created it when it started.
      additionalProperties: false
      type: object
      required:
      - dialect
      - created_now
      title: StoreInfo
      description: 'ProbeOwl''s own store, as first run reports it: never its URL
        or login.'
    SuggestedRunbook:
      properties:
        runbook:
          $ref: '#/components/schemas/RunbookView'
        matched:
          items:
            type: string
          type: array
          title: Matched
          description: The <location>.<outcome> it matched in this run.
      additionalProperties: false
      type: object
      required:
      - runbook
      - matched
      title: SuggestedRunbook
      description: A runbook whose applies_to matches a run's outcomes.
    SuppliedFile:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        text:
          type: string
          title: Text
      type: object
      required:
      - name
      - text
      title: SuppliedFile
      description: A file or text the person supplied.
    TableLabel:
      type: string
      enum:
      - transaction
      - master
      - audit
      - log
      - reference
      - external_mapping
      - outbox
      title: TableLabel
      description: What kind of table it is. Each label sets defaults for guards,
        masking and templates.
    TableReview:
      properties:
        connector:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Connector
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema
        table:
          type: string
          title: Table
        label:
          anyOf:
          - $ref: '#/components/schemas/TableLabel'
          - type: 'null'
          description: The confirmed label in catalog.yaml; null when the table is
            not in it.
        suggestion:
          anyOf:
          - $ref: '#/components/schemas/LabelSuggestion'
          - type: 'null'
          description: Guessed from the first environment it was imported in; null
            if never.
        imported_in:
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          type: array
          title: Imported In
          description: Environments with an import of this table.
        drift:
          items:
            $ref: '#/components/schemas/Drift'
          type: array
          title: Drift
        used_by:
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          type: array
          title: Used By
          description: Probes that read this table.
      additionalProperties: false
      type: object
      required:
      - connector
      - table
      - label
      - suggestion
      - imported_in
      title: TableReview
      description: 'One table: what the catalog says, what the imports show, and which
        probes read it.'
    TableSchema:
      properties:
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema
          description: 'SQL Server and Oracle: the schema or owner. MariaDB: none
            (the database).'
        table:
          type: string
          title: Table
        columns:
          items:
            $ref: '#/components/schemas/ColumnSchema'
          type: array
          title: Columns
        primary_key:
          items:
            type: string
          type: array
          title: Primary Key
        indexes:
          items:
            $ref: '#/components/schemas/IndexSchema'
          type: array
          title: Indexes
        approx_rows:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Approx Rows
          description: The database's own estimate, not a count.
      additionalProperties: false
      type: object
      required:
      - table
      - columns
      title: TableSchema
      description: 'One table: its columns, primary key, indexes and an estimate of
        its rows.'
    TickRunbookStep:
      properties:
        done:
          type: boolean
          title: Done
      additionalProperties: false
      type: object
      required:
      - done
      title: TickRunbookStep
      description: A manual step's tick.
    UnfilledParameter:
      properties:
        parameter:
          type: string
          title: Parameter
        why:
          type: string
          title: Why
      additionalProperties: false
      type: object
      required:
      - parameter
      - why
      title: UnfilledParameter
      description: A parameter left as :name, and why. A masked value is never filled
        in.
    ValueKind:
      type: string
      enum:
      - datetime
      - date
      - time
      - integer
      - decimal
      - float
      - boolean
      - text
      title: ValueKind
      description: What type a value was when it was read, since evidence keeps dates
        and decimals as text.
    WriteQueryStepView:
      properties:
        kind:
          type: string
          const: write_query
          title: Kind
        id:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9-]*$
          title: Id
          description: Short and unique in its runbook. Results, ticks and the audit
            key on it.
        title:
          type: string
          minLength: 1
          title: Title
        using:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Using
        sql:
          type: string
          minLength: 1
          title: Sql
        requires:
          type: string
          minLength: 1
          title: Requires
          description: The approval needed, such as change approval.
        runnable:
          type: boolean
          const: false
          title: Runnable
          description: Write queries are never run by ProbeOwl.
        relabelled:
          type: boolean
          title: Relabelled
          description: Its author called it a read query; the server overruled that.
          default: false
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - title
      - using
      - sql
      - requires
      - runnable
      title: WriteQueryStepView
      description: A write query step. Never runnable.
    YamlFile:
      properties:
        path:
          type: string
          title: Path
          description: Relative to the folder owl serve loaded.
        text:
          type: string
          title: Text
          description: The file's whole text, unchanged.
      additionalProperties: false
      type: object
      required:
      - path
      - text
      title: YamlFile
      description: A probe's or an entity's file as it is on disk, comments included,
        for the editor.
  securitySchemes:
    ProbeOwlRequest:
      type: apiKey
      in: header
      name: X-ProbeOwl-Request
      description: 'Send `X-ProbeOwl-Request: 1` on every request that is not a GET.
        owl serve also refuses a Host other than 127.0.0.1 or localhost on its port,
        and an Origin other than its web app''s. It sends no CORS headers.'
