components:
  schemas:
    Actor:
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        name:
          type: string
          minLength: 1
          title: Name
          description: The operating system user, or 'scheduler'.
        on_behalf_of:
          anyOf:
          - type: string
          - type: 'null'
          title: On Behalf Of
          description: The person an agent acts for.
      additionalProperties: false
      type: object
      required:
      - kind
      - name
      title: Actor
      description: Who started a run.
    ActorKind:
      type: string
      enum:
      - person
      - scheduler
      - agent
      title: ActorKind
      description: Who started a run.
    ApplicationSummary:
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Name
        title:
          type: string
          title: Title
        owner:
          type: string
          title: Owner
        environments:
          items:
            $ref: '#/components/schemas/EnvironmentSummary'
          type: array
          title: Environments
      additionalProperties: false
      type: object
      required:
      - name
      - title
      - owner
      - environments
      title: ApplicationSummary
      description: An application as listed in the application selector.
    AppliesTo:
      properties:
        entity:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Entity
        when:
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*\.(found|missing|waiting|blocked|ambiguous|error|stale|not_configured)$
            description: <location>.<outcome>, such as ledger.missing.
          type: array
          minItems: 1
          title: When
      additionalProperties: false
      type: object
      required:
      - entity
      - when
      title: AppliesTo
      description: When a failed run suggests this runbook.
    ArrayMatch:
      type: string
      enum:
      - by_position
      - any_order
      - by_key
      title: ArrayMatch
      description: How array elements are paired.
    BindingHealth:
      type: string
      enum:
      - healthy
      - lagging
      - paused
      - stopped
      - unreachable
      - not_checked
      - not_configured
      title: BindingHealth
      description: How a binding is doing right now.
    Capability:
      type: string
      enum:
      - local_input
      title: Capability
      description: What a plugin may be given. Only what is built can be declared.
    Cardinality:
      type: string
      enum:
      - one
      - optional
      - many
      title: Cardinality
      description: How many records a location should return.
    Catalog:
      properties:
        catalog:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Catalog
          description: The application this catalog belongs to.
        tables:
          items:
            $ref: '#/components/schemas/CatalogTable'
          type: array
          minItems: 1
          title: Tables
      additionalProperties: false
      type: object
      required:
      - catalog
      - tables
      title: Catalog
      description: An application's table catalog.
    CatalogChange:
      properties:
        path:
          type: string
          title: Path
          description: Relative to the folder owl serve loaded.
        diff:
          type: string
          title: Diff
          description: Unified diff of the change.
        base:
          type: string
          title: Base
          description: sha256 of the file before the change, or 'absent'.
        after:
          type: string
          title: After
          description: sha256 of the file after the change.
        written:
          type: boolean
          title: Written
      additionalProperties: false
      type: object
      required:
      - path
      - diff
      - base
      - after
      - written
      title: CatalogChange
      description: A change to a YAML file in the folder owl serve loaded. Never committed
        or pushed.
    CatalogReview:
      properties:
        application:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Application
        tables:
          items:
            $ref: '#/components/schemas/TableReview'
          type: array
          title: Tables
        unconfirmed:
          type: integer
          title: Unconfirmed
          description: Tables with a suggested label not yet in catalog.yaml.
        drifted:
          type: integer
          title: Drifted
          description: Tables that differ from a live schema somewhere.
      additionalProperties: false
      type: object
      required:
      - application
      - tables
      - unconfirmed
      - drifted
      title: CatalogReview
      description: 'An application''s tables to review: unconfirmed labels, drift,
        tables probes read.'
    CatalogTable:
      properties:
        connector:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Connector
        table:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          title: Table
        label:
          $ref: '#/components/schemas/TableLabel'
        owner:
          type: string
          minLength: 1
          title: Owner
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        columns:
          patternProperties:
            ^[A-Za-z_][A-Za-z0-9_]*$:
              $ref: '#/components/schemas/Column'
          propertyNames:
            maxLength: 128
          type: object
          title: Columns
          description: Marked columns only; unmarked columns are not listed.
        retention:
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]*(ms|s|m|h|d)$
            description: A duration such as 2s, 2m, 1h or 7d.
          - type: 'null'
          title: Retention
          description: How long rows are kept.
        approx_rows:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Approx Rows
      additionalProperties: false
      type: object
      required:
      - connector
      - table
      - label
      - owner
      - columns
      title: CatalogTable
      description: One table in the catalog, with its label, owner and marked columns.
    Change:
      type: string
      enum:
      - changed
      - added
      - removed
      title: Change
      description: How a path differs.
    CheckStatus:
      type: string
      enum:
      - pass
      - warn
      - fail
      title: CheckStatus
      description: Pass; warn (saving is allowed, with the reason); or fail (saving
        is refused).
    Column:
      properties:
        roles:
          items:
            $ref: '#/components/schemas/ColumnRole'
          type: array
          minItems: 1
          title: Roles
        indexed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Indexed
          description: 'For time columns: is it indexed?'
        values:
          items:
            type: string
          type: array
          title: Values
          description: 'For status columns: the values it can hold.'
        links_to:
          anyOf:
          - $ref: '#/components/schemas/LinkTarget'
          - type: 'null'
          description: For link and external key columns.
      additionalProperties: false
      type: object
      required:
      - roles
      title: Column
      description: One marked column and its roles.
    ColumnRole:
      type: string
      enum:
      - primary_key
      - time
      - status
      - link
      - external_key
      - pii
      - compare
      - expected_to_vary
      title: ColumnRole
      description: A marked column.
    ColumnSchema:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
          description: As the database names it, such as varchar(20) or number(18,2).
        nullable:
          type: boolean
          title: Nullable
      additionalProperties: false
      type: object
      required:
      - name
      - type
      - nullable
      title: ColumnSchema
      description: One column as the database defines it.
    CompareOptions:
      properties:
        ignore_paths:
          items:
            type: string
          type: array
          title: Ignore Paths
        ignore_key_order:
          type: boolean
          title: Ignore Key Order
          default: true
        arrays:
          $ref: '#/components/schemas/ArrayMatch'
          default: by_position
        array_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Array Key
          description: 'With arrays by_key: the field, or the CSV column, to match
            on.'
        ignore_whitespace:
          type: boolean
          title: Ignore Whitespace
          default: false
        ignore_case:
          type: boolean
          title: Ignore Case
          description: Applies to values, not to keys.
          default: false
        number_tolerance:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Number Tolerance
          default: '0'
      type: object
      title: CompareOptions
      description: What counts as the same.
    CompareRequest:
      properties:
        left:
          $ref: '#/components/schemas/SuppliedFile'
        right:
          $ref: '#/components/schemas/SuppliedFile'
        format:
          $ref: '#/components/schemas/FormatChoice'
          default: auto
        options:
          $ref: '#/components/schemas/CompareOptions'
      type: object
      required:
      - left
      - right
      title: CompareRequest
      description: Two files to compare.
    CompareResult:
      properties:
        left:
          $ref: '#/components/schemas/FileSummary'
        right:
          $ref: '#/components/schemas/FileSummary'
        summary:
          $ref: '#/components/schemas/CompareSummary'
        differences:
          items:
            $ref: '#/components/schemas/FileDifference'
          type: array
          title: Differences
        notes:
          items:
            type: string
          type: array
          title: Notes
        masked_left:
          anyOf:
          - items:
              $ref: '#/components/schemas/Range'
            type: array
          - type: 'null'
          title: Masked Left
          description: Everything to hide in the left file's side-by-side view. Null
            if a secret could not be located, so that view must not be shown.
        masked_right:
          anyOf:
          - items:
              $ref: '#/components/schemas/Range'
            type: array
          - type: 'null'
          title: Masked Right
      type: object
      required:
      - left
      - right
      - summary
      - differences
      - notes
      - masked_left
      title: CompareResult
      description: What differs, masked. Everything here is safe to show and export.
    CompareSummary:
      properties:
        changed:
          type: integer
          title: Changed
        added:
          type: integer
          title: Added
        removed:
          type: integer
          title: Removed
        unchanged:
          type: integer
          title: Unchanged
        ignored:
          type: integer
          title: Ignored
        masked:
          type: integer
          title: Masked
      type: object
      required:
      - changed
      - added
      - removed
      - unchanged
      - ignored
      - masked
      title: CompareSummary
      description: How much differs.
    ComparedField:
      properties:
        location:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Location
        connector:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Connector
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
          description: 'The compare field. Null: the location''s outcome and rows.'
        failing:
          $ref: '#/components/schemas/JsonValue'
          description: Always null for a masked field.
        healthy:
          $ref: '#/components/schemas/JsonValue'
          description: Always null for a masked field.
        result:
          $ref: '#/components/schemas/FieldResult'
        masked:
          type: boolean
          title: Masked
          default: false
      additionalProperties: false
      type: object
      required:
      - location
      - connector
      - result
      title: ComparedField
      description: One location's outcome and rows, or one compare field, on the two
        subjects.
    Conclusion:
      type: string
      enum:
      - root_cause_found
      - no_issue
      - escalated
      title: Conclusion
      description: What an investigation concluded, added after the run.
    ConfigReload:
      properties:
        applications:
          type: integer
          minimum: 0.0
          title: Applications
          description: Applications loaded.
        connectors:
          type: integer
          minimum: 0.0
          title: Connectors
          description: Connectors loaded, across applications.
        probes:
          type: integer
          minimum: 0.0
          title: Probes
          description: Probes loaded, across applications.
        applications_added:
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          type: array
          title: Applications Added
        applications_removed:
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          type: array
          title: Applications Removed
        connectors_added:
          items:
            type: string
          type: array
          title: Connectors Added
          description: Each as application/connector.
        connectors_removed:
          items:
            type: string
          type: array
          title: Connectors Removed
          description: Each as application/connector.
        connectors_changed:
          items:
            type: string
          type: array
          title: Connectors Changed
          description: 'Connectors whose file changed: a binding, a guard or their
            owner.'
        note:
          type: string
          title: Note
          description: What a reload leaves as it was.
          default: Plugins, the port, the store and the log file change only when
            owl serve is restarted.
      additionalProperties: false
      type: object
      required:
      - applications
      - connectors
      - probes
      title: ConfigReload
      description: The configuration owl serve loaded again, and how it differs from
        the one before.
    ConfirmTable:
      properties:
        entry:
          $ref: '#/components/schemas/CatalogTable'
        base:
          anyOf:
          - type: string
          - type: 'null'
          title: Base
          description: 'The base of the preview being confirmed. Omitted: nothing
            is written and the change is returned. Given: written only if catalog.yaml
            is still as it was then.'
      additionalProperties: false
      type: object
      required:
      - entry
      title: ConfirmTable
      description: 'A table''s catalog entry to confirm. Without base: preview it.
        With it: write it.'
    ConnectionTest:
      properties:
        connector:
          type: string
          title: Connector
        environment:
          type: string
          title: Environment
        reachable:
          type: boolean
          title: Reachable
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why not, when it could not be reached.
        duration_ms:
          type: integer
          title: Duration Ms
      additionalProperties: false
      type: object
      required:
      - connector
      - environment
      - reachable
      - duration_ms
      title: ConnectionTest
      description: What Test connection found for one binding.
    ConnectorStatus:
      properties:
        connector:
          type: string
          title: Connector
        type:
          type: string
          title: Type
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        environment:
          type: string
          title: Environment
        production:
          type: boolean
          title: Production
        health:
          $ref: '#/components/schemas/BindingHealth'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        secret:
          anyOf:
          - $ref: '#/components/schemas/SecretState'
          - type: 'null'
          description: 'Whether this machine has the binding''s password or token:
            missing means its keychain entry does not exist here, so ask for it. Null
            with no binding here.'
        replica:
          type: boolean
          title: Replica
          default: false
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
          description: 'What kind of copy this binding reads from: Read replica, Readable
            secondary or Active Data Guard standby. Null for a REST API, for a SQL
            binding that is not a replica, or with no binding here.'
        limits:
          items:
            type: string
          type: array
          title: Limits
          description: 'The limits a lookup runs under, as enforced today: its time
            limit, then the default row cap (a many location can set its own), or
            a REST API''s rate budget and that it only reads with GET.'
        row_ceiling:
          anyOf:
          - type: integer
          - type: 'null'
          title: Row Ceiling
          description: The most rows one lookup through this connector may return.
            Null with no binding here.
        transport:
          anyOf:
          - type: string
          - type: 'null'
          title: Transport
        time_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Zone
          description: 'Oracle: the time zone its sessions use, such as ''+04:00 (from
            the binding)'' or ''the database''s own (DBTIMEZONE)''. Null for SQL Server
            and MariaDB, which have none to set, for a REST API, or with no binding
            here.'
        lag_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Lag Seconds
        lag_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Lag Note
        max_replica_lag_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Replica Lag Seconds
        plan_access:
          anyOf:
          - $ref: '#/components/schemas/PlanAccess'
          - type: 'null'
          description: Null for a REST API, which has no plans.
        plan_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Message
        guards:
          items:
            type: string
          type: array
          title: Guards
        forbidden:
          items:
            type: string
          type: array
          title: Forbidden
          description: What the statement guard refuses in this dialect's probe SQL,
            by example. Empty for a REST API, whose guards say what it may do.
      additionalProperties: false
      type: object
      required:
      - connector
      - type
      - environment
      - production
      - health
      title: ConnectorStatus
      description: One connector in one environment.
    CopiedWriteQuery:
      properties:
        text:
          type: string
          title: Text
          description: Its SQL under a header naming the environment and the run.
        unfilled:
          items:
            $ref: '#/components/schemas/UnfilledParameter'
          type: array
          title: Unfilled
      additionalProperties: false
      type: object
      required:
      - text
      title: CopiedWriteQuery
      description: A write query to take to a change request. Copying it was recorded
        in the audit.
    DraftConnection:
      properties:
        connector:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Connector
          description: Its connector, which may not exist yet.
        type:
          type: string
          enum:
          - sqlserver
          - oracle
          - mariadb
          - rest
          title: Type
        environment:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Environment
        binding:
          anyOf:
          - $ref: '#/components/schemas/SqlBindingDraft'
          - $ref: '#/components/schemas/RestBindingDraft'
          - type: 'null'
          title: Binding
          description: 'Where it points. Omitted for a connector already bound in
