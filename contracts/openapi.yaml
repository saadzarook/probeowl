            password does before saving.'
        password:
          anyOf:
          - type: string
            maxLength: 1024
            minLength: 1
            format: password
            writeOnly: true
          - type: 'null'
          title: Password
          description: 'Used for this one test only: never stored, logged or returned.'
        use_saved_password:
          type: boolean
          title: Use Saved Password
          description: Use the password this machine's keychain has for the binding.
          default: false
      additionalProperties: false
      type: object
      required:
      - connector
      - type
      - environment
      title: DraftConnection
      description: A binding that is not saved yet, to connect to once; or a saved
        one, with a new password.
    DraftProbe:
      properties:
        probe:
          type: string
          minLength: 1
          title: Probe
          description: The probe's YAML, as in the editor.
        entity:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
          description: 'The entity''s YAML when it is edited too; omitted: the loaded
