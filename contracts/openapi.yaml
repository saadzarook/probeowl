        environment:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          - type: 'null'
          title: Environment
          description: Where plans are read for the index checks.
      additionalProperties: false
      type: object
      required:
      - probe
      title: DraftProbe
      description: A probe as it is being edited, and optionally its entity, to check
