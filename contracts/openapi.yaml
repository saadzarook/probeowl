    DraftRun:
      properties:
        probe:
          type: string
          minLength: 1
          title: Probe
          description: The probe's YAML, as in the editor.
        entity:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
          description: The entity's YAML when it is edited too.
        environment:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Environment
        value:
          type: string
          minLength: 1
          title: Value
          description: Any identifier of the subject.
        identifier:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          - type: 'null'
          title: Identifier
        investigation:
          $ref: '#/components/schemas/InvestigationRecord'
      additionalProperties: false
      type: object
      required:
      - probe
      - environment
      - value
      - investigation
      title: DraftRun
      description: 'Run a draft probe without saving it, like any run: checked, guarded,
        stored, audited.'
    Drift:
      properties:
        environment:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Environment
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - environment
      - message
      title: Drift
      description: One way the catalog or another environment differs from an environment's
