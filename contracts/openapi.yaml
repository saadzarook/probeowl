openapi: 3.1.0
info:
  title: ProbeOwl API
  description: Validate production data across databases and APIs, safely.
  version: 0.1.0
paths:
  /api/applications:
    get:
      tags:
      - applications
      summary: List Applications
      description: List the applications this ProbeOwl knows.
      operationId: list_applications
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationSummary'
                type: array
                title: Response List Applications
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}:
    get:
      tags:
      - applications
      summary: Get Application
      description: Get one application.
      operationId: get_application
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSummary'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - setup
      summary: Save Application
      description: 'Write a new application''s application.yaml into the folder owl
        serve loaded.


        As every save: first without `base`, nothing is written and the response is
        the change;

        then with that `base` to write exactly that change. Loaded at once, so the
        next screen

        finds it. 409 if an application of that id is loaded already, if the file
        changed since

        its preview, or while a run is running. Never commits or pushes; audited.'
      operationId: save_application
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
          title: Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveApplication'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogChange'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/applications/{application}/environments:
    get:
      tags:
      - applications
      summary: List Environments
      description: List an application's environments.
      operationId: list_environments
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentSummary'
                title: Response List Environments
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}/entities:
    get:
      tags:
      - entities
      summary: List Entities
      description: List an application's entities with their identifiers and locations.
      operationId: list_entities
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
                title: Response List Entities
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}/entities/{entity}:
    get:
      tags:
      - entities
      summary: Get Entity
      description: 'Get one entity: identifiers, locations and key graph.'
      operationId: get_entity
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: entity
        in: path
        required: true
        schema:
          type: string
          title: Entity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - entities
      summary: Save Entity
      description: 'Save a new entity into its own YAML file in the folder owl serve
        loaded.


        As a probe''s save: first without `base`, nothing is written and the response
        is the change

        and the save checks'' report, plans included; then with that `base` to write
        exactly that

        change. An entity failing a save check is a 422 and is never written; 409
        if the file

        changed in between. Only a new entity: one that exists is changed with one
        of its probes,

        so that they are checked together. Never commits or pushes; audited.'
      operationId: save_entity
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: entity
        in: path
        required: true
        schema:
          type: string
          title: Entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEntity'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityChange'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/applications/{application}/probes:
    get:
      tags:
      - probes
      summary: List Probes
      description: 'List an application''s inspect and validate probes.


        entity: only that entity''s probes. environment: only the probes enabled there.'
      operationId: list_probes
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: entity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity
      - name: environment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProbeSummary'
                title: Response List Probes
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}/probes/checks:
    post:
      tags:
      - probes
      summary: Check Draft Probe
      description: 'The save checks of a draft probe (and entity), without saving
        anything.


        Read-only SQL for every lookup the probe can run (its entity''s lookups, fallbacks,

        fan-out and identifier lookups), the expectations against the entity, the
        environments''

        bindings, and the label rules: a Transaction, Log or Audit table is read by
        key or within

        a time window, and every PII column selected is masked. A failed check means
        it cannot be

        saved; a draft that cannot be read fails the first check.'
      operationId: check_draft_probe
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftProbe'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveCheckReport'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/plugins:
    get:
      tags:
      - plugins
      summary: List Plugins
      description: The plugins that are on. One that is off is not listed, and its
        routes do not exist.
      operationId: list_plugins
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PluginManifest'
                type: array
                title: Response List Plugins
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/me:
    get:
      tags:
      - runs
      summary: Who Am I
      description: 'Who is acting: the person running owl serve, as every run and
        audit record names them.'
      operationId: who_am_i
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/config/reload:
    post:
      tags:
      - connectors
      summary: Reload Configuration
      description: 'Read owl serve''s config folder again and load it, without a restart.
        Audited.


        The folder is checked exactly as at start: if owl serve would refuse it, the
        reload is

        refused (422) and the configuration loaded before stays. Refused (409) while
        a run is

        running. Kill switches stay as they are: they are kept in the store, not the
        folder.'
      operationId: reload_configuration
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigReload'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/kill-switches:
    get:
      tags:
      - connectors
      summary: List Kill Switches
      description: The kill switches that are on. 503 if the store cannot be read.
      operationId: list_kill_switches
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KillSwitch'
                type: array
                title: Response List Kill Switches
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - connectors
      summary: Engage Kill Switch
      description: 'Turn a kill switch on: global, for an application, or for a connector
        in every environment.


        It stops every read through what it covers: runs, plan checks, schema import,
        live status and

        Test connection. A lookup in flight finishes within its statement timeout,
        then the run stops

        with this reason; new runs are Skipped. If it is already on, returns it as
        it is. Audited.'
      operationId: engage_kill_switch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetKillSwitch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/kill-switches/release:
    post:
      tags:
      - connectors
      summary: Release Kill Switch
      description: 'Turn a kill switch off, and return what was on. Audited. 404 if
        it is not on.


        Broader switches that are on still apply.'
      operationId: release_kill_switch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetKillSwitch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Not Implemented
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ProbeOwlRequest: []
  /api/applications/{application}/probes/{probe}/yaml:
    get:
      tags:
      - probes
      summary: Get Probe Yaml
      description: 'Get a probe''s file as it is on disk, to edit: a rebuilt copy
        would lose its comments.


        404 if there is no such probe; 422 if the file holds more than this probe.'
      operationId: get_probe_yaml
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: probe
        in: path
        required: true
        schema:
          type: string
          title: Probe
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YamlFile'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}/entities/{entity}/yaml:
    get:
      tags:
      - entities
      summary: Get Entity Yaml
      description: 'Get an entity''s file as it is on disk, to edit: a rebuilt copy
        would lose its comments.


        404 if there is no such entity; 422 if the file holds more than this entity.'
      operationId: get_entity_yaml
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: entity
        in: path
        required: true
        schema:
          type: string
          title: Entity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YamlFile'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/applications/{application}/probes/{probe}:
    put:
      tags:
      - probes
      summary: Save Probe
      description: 'Save a probe into its YAML file in the folder owl serve loaded.


        Call it first without `base`: nothing is written, and the response is the
        change as a

        diff with its `base` and the save checks'' report. Then call it again with
        that `base` to

        write exactly that change, atomically. The save checks run both times, plans
        included: a

        probe that fails one is a 422 naming each failure, and is never written. 409
        if a file

        changed in between. Never commits or pushes; audited.


        With `entity`, its file is saved too, under the same rules: one `base` covers
        both, and

        both are written or neither. Other probes of the entity must still pass.


        In a Production environment, a write whose plan checks could not run is a
        422 unless

        `save_without_plan_check` is true; that acknowledgement is audited with the
        actor.'
      operationId: save_probe
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
          title: Application
      - name: probe
        in: path
        required: true
        schema:
          type: string
          title: Probe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProbe'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeChange'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Implemented
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
