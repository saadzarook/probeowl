# Author: @SaadZarook
# These are local containers from dev/, labelled Production for testing. They are not
# replicas; replica: true lets Production rules apply to the examples.
connector: access_db
type: mariadb
owner: access-team
environments:
  prod:
    host: 127.0.0.1
    port: 3306
    database: access
    user: probeowl_ro
    secret: keyring:probeowl/access_db.prod
    replica: true
    trust_server_certificate: true
    trust_server_certificate_reason: local dev container with a self-signed certificate
  uat:
    host: 127.0.0.1
    port: 3306
    database: access_uat
    user: probeowl_ro
    secret: env:PROBEOWL_ACCESS_DB_UAT
    trust_server_certificate: true
    trust_server_certificate_reason: local dev container with a self-signed certificate
