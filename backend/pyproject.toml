# Author: @SaadZarook
[project]
name = "probeowl"
version = "0.1.0"
description = "Validate production data across databases and APIs, safely."
license = "Apache-2.0"
authors = [{ name = "Saad Zarook (@SaadZarook)" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "mssql-python>=1.16",
    "oracledb>=2.4",
    "pydantic>=2.9",
    "pymysql>=1.1",
    "pyyaml>=6",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
    "sqlglot>=25",
    # Upper bounds are the newest tested: uv tool install resolves fresh, not from uv.lock, and
    # Typer 0.29 changed how prompts take click types (#248). Raise them after the wheel check passes.
    "typer>=0.12,<0.30",
    # Through uvicorn and typer; bounded to what the release check has run.
    "click>=8.1,<9",
    "uvicorn>=0.30",
]

[project.scripts]
owl = "probeowl.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.23",
    "keyrings-alt>=5",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.8",
    "testcontainers>=4.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-docker>=7.2.0.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "types-pymysql>=1.2.0.20260923",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probeowl"]

[tool.hatch.build.targets.wheel.force-include]
"../plugins" = "plugins"

# A release wheel carries the web app's build (hatch_build.py); editable installs do not.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# The plugins are copied in at install, so a change to one must reinstall, or dev runs a stale copy.
cache-keys = [{ file = "pyproject.toml" }, { file = "../plugins/**/*" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE and E722 enforce the AGENTS.md rule: no bare or blind except.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# AGENTS.md: strict on engine/ and guards/. mypy has no per-module "strict",
# so the strict flags are listed one by one.
[[tool.mypy.overrides]]
module = ["probeowl.engine.*", "probeowl.guards.*", "probeowl.comparison"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true

# keyrings.alt ships no type information; it is only used by tests and CI.
[[tool.mypy.overrides]]
module = ["keyrings.alt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "database: needs a real PostgreSQL, SQL Server, MariaDB or Oracle (URL or CI container)",
]
